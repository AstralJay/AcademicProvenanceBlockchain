<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>

<body>

    <h1>Academic Provenance Blockchain</h1>

    <h2>Student Registration</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <label>Name:</label>
        <br>

        <input
            type="text"
            name="name"
            required
        >

        <br><br>


        <label>Email:</label>
        <br>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>


        <label>Password:</label>
        <br>

        <input
            type="password"
            name="password"
            minlength="8"
            required
        >

        <br><br>


        <button type="submit">
            Register
        </button>

    </form>


    <p>
        Already have an account?
        <a href="{{ url_for('auth.login') }}">
            Login
        </a>
    </p>

</body>

</html>
